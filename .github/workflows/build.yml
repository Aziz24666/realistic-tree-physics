name: Build Realistic Tree Physics

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace --warning-mode all

      - name: List build outputs
        if: always()
        run: ls -lah build/libs || true

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-tree-physics-2.0.1
          path: build/libs/*.jar
